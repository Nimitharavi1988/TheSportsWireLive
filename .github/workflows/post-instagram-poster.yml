name: Post Instagram poster

on:
  # Triggered on-demand from the admin "Post Instagram poster" button
  # (src/app/admin/actions.ts) via the GitHub API's workflow-dispatch
  # endpoint, not on a schedule. Manual runs via the Actions tab also work.
  workflow_dispatch:
    inputs:
      article_id:
        description: "Article ID to post"
        required: true

permissions:
  contents: write

jobs:
  post-poster:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # next/og renders here (plain Node) rather than in the deployed
      # Cloudflare Worker, where it's a confirmed bad fit (Satori/WASM
      # incompatibility) — see postInstagramPosterJob.ts's header comment.
      - run: npx tsx src/lib/social/postInstagramPosterJob.ts
        env:
          ARTICLE_ID: ${{ inputs.article_id }}
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          SITE_URL: ${{ vars.SITE_URL }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
