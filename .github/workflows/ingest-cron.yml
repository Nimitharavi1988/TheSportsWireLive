name: Ingestion cron

on:
  # No GitHub `schedule:` trigger here anymore — confirmed directly via the
  # Actions run history that it had real multi-hour gaps (e.g. 17:25 ->
  # 19:54 -> 22:08 -> 00:18 UTC) despite each run only taking 6-12 minutes,
  # a GitHub Actions platform scheduling reliability issue under load, not
  # our own code. A shorter 20-min interval didn't fix it either (still a
  # 5-hour gap observed). Replaced entirely with an external trigger
  # (cron-job.org, every 15 min) that calls this workflow's dispatch API
  # directly — confirmed reliable, and removing GitHub's own schedule
  # avoids the two occasionally firing close together and double-running
  # ingestion (wasted Gemini commentary budget for zero extra coverage).
  # workflow_dispatch stays enabled both for the external trigger and for
  # manual runs via the Actions tab.
  workflow_dispatch: {}

# contents: write — autoApprove.ts's Instagram posting now generates and
# commits a poster image per post (postInstagramPoster.ts), since next/og
# can't render in the deployed Cloudflare Worker. Default GITHUB_TOKEN
# permissions would otherwise be read-only for contents on some repos.
permissions:
  contents: write

jobs:
  run-ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Runs ingestion directly on the GitHub Actions runner instead of via
      # the Cloudflare Worker's /api/cron/ingest endpoint — Workers Free
      # caps every request at 10ms of *CPU* time (not wall-clock; fetch/
      # sleep waiting doesn't count), which processing hundreds of RSS/
      # match items can't realistically fit into regardless of subrequest
      # optimization. GitHub Actions runners have no such limit.
      - run: npx tsx src/lib/ingestion/runIngest.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          API_FOOTBALL_KEY: ${{ secrets.API_FOOTBALL_KEY }}
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      # Official YouTube videos (src/lib/videos/youtubeSync.ts): new uploads
      # from the channels' RSS feeds, and highlights linked to the match
      # stories ingestion just updated. Keyless; own step so a YouTube
      # outage never touches ingestion or posting.
      - if: ${{ !cancelled() }}
        run: npx tsx src/lib/videos/youtubeSync.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
      # Auto-approves only the pending articles that clear a real bar on top
      # of every automated quality gate already passed to reach
      # pending_review: substantive real body content (not the generic
      # fallback) AND a real image (not the generic stock-photo fallback).
      # See autoApprove.ts for the exact thresholds and reasoning. Runs as
      # its own step (not inside runIngest.ts) so a failure here can never
      # affect ingestion itself, and only needs DATABASE_URL.
      # SITE_URL/INDEXNOW_KEY are for the best-effort IndexNow ping on newly
      # published articles (src/lib/indexNow.ts) — a failure or missing
      # value there is swallowed, never fails this step.
      # FACEBOOK_PAGE_ID/FACEBOOK_PAGE_ACCESS_TOKEN/INSTAGRAM_BUSINESS_ACCOUNT_ID
      # drive the notable-story auto-post to both platforms (postSocialPoster,
      # called from within autoApprove.ts, capped at 2 attempts per platform
      # per run) — this runner is where that automated posting actually
      # executes, not the Cloudflare Worker (which only needs these for the
      # separate manual-approval-button path). Missing/empty is treated as
      # "not configured" and silently skipped, same as always.
      # GEMINI_API_KEY is for the shared poster's per-article hook/table copy
      # (socialPoster.ts's generatePosterContent call) — a separate Gemini
      # call from runIngest.ts's own commentary budget above.
      # if: !cancelled() -- runIngest.ts above calls process.exit(1) on any
      # uncaught error anywhere in its pipeline (hundreds of RSS/API calls
      # per run, real surface area for a transient failure). Without this,
      # GitHub Actions' default "skip remaining steps after a failure"
      # behavior meant one flaky ingestion run silently skipped Facebook/
      # Instagram posting entirely for that cycle -- confirmed live
      # (2026-09-20): a real multi-run posting gap with a healthy backlog
      # and daily budget to spare, explained by exactly this. Posting is
      # meant to be independent of ingestion's success (see the comment
      # above autoApprove.ts's own step), so it should still run even when
      # runIngest.ts fails, same as the reverse is already true.
      - if: ${{ !cancelled() }}
        run: npx tsx src/lib/ingestion/autoApprove.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          SITE_URL: ${{ vars.SITE_URL }}
          INDEXNOW_KEY: ${{ secrets.INDEXNOW_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          FACEBOOK_PAGE_ID: ${{ secrets.FACEBOOK_PAGE_ID }}
          FACEBOOK_PAGE_ACCESS_TOKEN: ${{ secrets.FACEBOOK_PAGE_ACCESS_TOKEN }}
          INSTAGRAM_BUSINESS_ACCOUNT_ID: ${{ secrets.INSTAGRAM_BUSINESS_ACCOUNT_ID }}
