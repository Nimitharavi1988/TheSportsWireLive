name: Ingestion cron

on:
  # 30-min interval had real multi-hour gaps in practice — confirmed
  # directly via the Actions run history (e.g. 17:25 -> 19:54 -> 22:08 ->
  # 00:18 UTC) despite each run itself only taking 6-12 minutes, a GitHub
  # Actions platform scheduling reliability issue under load, not caused by
  # our own code. Trying a shorter interval first (more attempts, more
  # chances one lands) before committing to an external trigger service —
  # this doesn't fix the root cause, so revisit with an external cron
  # (pinging workflow_dispatch directly) if gaps are still bad at 20 min.
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch: {}

jobs:
  run-ingest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      # Runs ingestion directly on the GitHub Actions runner instead of via
      # the Cloudflare Worker's /api/cron/ingest endpoint — Workers Free
      # caps every request at 10ms of *CPU* time (not wall-clock; fetch/
      # sleep waiting doesn't count), which processing hundreds of RSS/
      # match items can't realistically fit into regardless of subrequest
      # optimization. GitHub Actions runners have no such limit.
      - run: npx tsx src/lib/ingestion/runIngest.ts
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}
          FOOTBALL_DATA_API_KEY: ${{ secrets.FOOTBALL_DATA_API_KEY }}
          CRICKETDATA_API_KEY: ${{ secrets.CRICKETDATA_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
